[project]
name = "medicore-ai"
version = "0.1.0"
description = "AI operations platform for small clinics, dental practices, and diagnostic centers"
requires-python = ">=3.12"
dependencies = [
    # Web backend
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",

    # Database
    "sqlalchemy>=2.0.35",

    # LLMs
    "openai>=1.52.0",
    "anthropic>=0.37.0",

    # Agent orchestration
    "langchain>=0.3.7",
    "langchain-openai>=0.2.5",
    "langchain-community>=0.3.5",
    "langgraph>=0.2.45",
    "langgraph-checkpoint-sqlite>=2.0.1",

    # RAG / vector store
    "langchain-chroma>=0.1.4",
    "chromadb>=0.5.15",

    # MCP
    "mcp>=1.0.0",

    # Frontend
    "gradio>=5.5.0",

    # Document generation
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "reportlab>=4.2.5",
    "pypdf>=5.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "black>=24.10.0",
]
